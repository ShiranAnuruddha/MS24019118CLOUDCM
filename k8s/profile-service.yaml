apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: YOUR_ECR/profile-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: hiresphere
spec:
  selector:
    app: profile-service
  ports:
    - port: 4001
      targetPort: 4001
