apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: YOUR_ECR/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BYPASS_AUTH
              value: "false"
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hiresphere
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
