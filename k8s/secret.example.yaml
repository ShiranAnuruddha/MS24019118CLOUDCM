apiVersion: v1
kind: Secret
metadata:
  name: hiresphere-secrets
  namespace: hiresphere
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:change-me@YOUR_RDS_ENDPOINT:5432/hiresphere
  INTERNAL_SERVICE_TOKEN: change-me
  COGNITO_USER_POOL_ID: us-east-1_example
  COGNITO_CLIENT_ID: exampleclientid
  S3_BUCKET: your-submission-bucket
  S3_PUBLIC_BASE_URL: https://your-submission-bucket.s3.amazonaws.com
