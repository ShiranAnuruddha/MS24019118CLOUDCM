apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
    spec:
      containers:
        - name: messaging-service
          image: YOUR_ECR/messaging-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: PORT
              value: "4004"
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: hiresphere
spec:
  selector:
    app: messaging-service
  ports:
    - port: 4004
      targetPort: 4004
