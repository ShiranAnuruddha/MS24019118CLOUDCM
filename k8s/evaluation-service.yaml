apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
        - name: evaluation-service
          image: YOUR_ECR/evaluation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4005
          env:
            - name: PORT
              value: "4005"
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: hiresphere
spec:
  selector:
    app: evaluation-service
  ports:
    - port: 4005
      targetPort: 4005
