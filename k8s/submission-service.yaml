apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: hiresphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
    spec:
      containers:
        - name: submission-service
          image: YOUR_ECR/submission-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
          envFrom:
            - configMapRef:
                name: hiresphere-config
            - secretRef:
                name: hiresphere-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: hiresphere
spec:
  selector:
    app: submission-service
  ports:
    - port: 4003
      targetPort: 4003
